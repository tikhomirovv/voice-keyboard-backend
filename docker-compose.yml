name: voice-key-backend-go

services:
  db:
    container_name: voice-key-db
    image: postgres:17.4-alpine3.21
    restart: unless-stopped
    networks:
      - voice-key
    volumes:
      - ./.docker/volumes/postgresql:/var/lib/postgresql/data/pgdata
    ports:
      - 5437:5432
    environment:
      - POSTGRES_DB=voice-key
      - POSTGRES_USER=voice-key
      - POSTGRES_PASSWORD=12345
      - PGDATA=/var/lib/postgresql/data/pgdata

networks:
  voice-key:
    name: voice-key
