{{define "base"}}
<!DOCTYPE html>
<html>
  <head>
    <title>{{template "title" .}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
      @layer components {
        .btn-primary {
          @apply px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg
                 shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2
                 focus:ring-blue-400 focus:ring-opacity-75 transition-colors;
        }
      }
    </style>
    {{template "styles" .}}
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
      <!-- Здесь может быть общий хедер -->
      <main>{{template "content" .}}</main>
      <!-- Здесь может быть общий футер -->
    </div>

    {{template "scripts" .}}
  </body>
</html>
{{end}}
