name: voice-key-backend-go-prod

services:
  # Database service
  db:
    container_name: voice-key-db
    image: postgres:17.4-alpine3.21
    restart: unless-stopped
    networks:
      - traefik
    volumes:
      - ./.docker/volumes/postgresql-prod:/var/lib/postgresql/data/pgdata
      - ./.docker/volumes/pg-backups-prod:/backups
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Application service
  backend:
    container_name: backend
    image: registry.gitlab.com/voice-keyboard/backend/app:current
    restart: unless-stopped
    networks:
      - traefik
    volumes:
      - /opt/app/config.yml:/app/config.yml:ro
      - /opt/app/releases:/app/releases
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`example.com`)
      - traefik.http.routers.backend.entrypoints=web,websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=production
      - traefik.http.middlewares.backend.headers.SSLRedirect=true
      - traefik.http.middlewares.backend.headers.STSSeconds=315360000
      - traefik.http.middlewares.backend.headers.browserXSSFilter=true
      - traefik.http.middlewares.backend.headers.contentTypeNosniff=true
      - traefik.http.middlewares.backend.headers.forceSTSHeader=true
      - traefik.http.middlewares.backend.headers.SSLHost=example.com
      - traefik.http.middlewares.backend.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.backend.headers.STSPreload=true
      - traefik.http.routers.backend.middlewares=backend@docker

networks:
  traefik:
    external: true
